[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "universaldocsgrabber"
version = "1.1.6"
description = "Local-first Windows email attachment downloader, OCR processor, and document organizer for IMAP and Gmail mailboxes with redacted Web/PWA companion."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "doc-bricks"}
]
keywords = [
    "email-downloader",
    "imap-attachment-downloader",
    "gmail-attachment-downloader",
    "invoice-extraction",
    "pdf-conversion",
    "tesseract-ocr",
    "local-first",
    "pyside6",
    "pwa-companion",
    "document-organizer"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Office/Business",
    "Topic :: Utilities"
]

[project.urls]
Homepage = "https://github.com/doc-bricks/UniversalDocsGrabber"
Documentation = "https://github.com/doc-bricks/UniversalDocsGrabber#readme"
Repository = "https://github.com/doc-bricks/UniversalDocsGrabber.git"
Issues = "https://github.com/doc-bricks/UniversalDocsGrabber/issues"
Changelog = "https://github.com/doc-bricks/UniversalDocsGrabber/blob/master/CHANGELOG.md"
Security = "https://github.com/doc-bricks/UniversalDocsGrabber/blob/master/SECURITY.md"
"Third-Party Licenses" = "https://github.com/doc-bricks/UniversalDocsGrabber/blob/master/THIRD_PARTY_LICENSES.md"
"Marketing Log" = "https://github.com/doc-bricks/UniversalDocsGrabber/blob/master/MARKETING-LOG.txt"
"LLM Ready" = "https://github.com/doc-bricks/UniversalDocsGrabber/blob/master/llms.txt"
"Parent Organization" = "https://github.com/doc-bricks"
"Umbrella Ecosystem" = "https://github.com/open-bricks"

[tool.pytest.ini_options]
addopts = "-ra -v"
pythonpath = "."
testpaths = ["tests"]
python_files = ["test_*.py", "source_platform_smoke.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C4"]
ignore = ["E501", "E701", "E702"]