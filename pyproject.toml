[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "universaldocsgrabber"
version = "1.1.2"
description = "Local-first Windows email attachment downloader, OCR processor, and document organizer for IMAP and Gmail mailboxes with redacted Web/PWA companion."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "doc-bricks"}
]
keywords = [
    "email-downloader",
    "imap-attachment-downloader",
    "gmail-attachment-downloader",
    "invoice-extraction",
    "pdf-conversion",
    "tesseract-ocr",
    "local-first",
    "pyside6",
    "pwa-companion",
    "document-organizer"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
    "Topic :: Office/Business",
    "Topic :: Utilities"
]

[project.urls]
Homepage = "https://github.com/doc-bricks/UniversalDocsGrabber"
Documentation = "https://github.com/doc-bricks/UniversalDocsGrabber#readme"
Repository = "https://github.com/doc-bricks/UniversalDocsGrabber.git"
Issues = "https://github.com/doc-bricks/UniversalDocsGrabber/issues"
Changelog = "https://github.com/doc-bricks/UniversalDocsGrabber/blob/master/CHANGELOG.md"

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
