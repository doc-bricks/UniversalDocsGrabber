[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "universaldocsgrabber"
version = "1.1.7"
description = "Local-first Windows email attachment downloader, OCR processor, and document organizer for IMAP and Gmail mailboxes with redacted Web/PWA companion."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md", "THIRD_PARTY_LICENSES.txt"]
authors = [
    {name = "doc-bricks", email = "support@lukasgeiger.com"}
]
keywords = [
    "attachment-downloader",
    "document-archive",
    "document-management",
    "document-workflow",
    "email",
    "email-attachment",
    "email-attachments",
    "gmail",
    "gmail-attachments",
    "imap",
    "invoice-extraction",
    "local-first",
    "mail-archive",
    "ocr",
    "offline-first",
    "pdf",
    "pwa",
    "pyside6",
    "python",
    "windows"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Office/Business",
    "Topic :: Utilities"
]
dependencies = [
    "PySide6>=6.5.0",
    "pypdf>=4.0.0",
    "reportlab>=4.0.0",
    "Pillow>=10.4.0",
    "xhtml2pdf>=0.2.11",
    "keyring>=25.0.0",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",
    "docx2pdf>=0.1.8",
    "pywin32>=306; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.9.0",
]
build = [
    "pyinstaller>=6.10.0",
    "altgraph>=0.17.4",
    "packaging>=24.0",
]

[project.urls]
Homepage = "https://github.com/doc-bricks/UniversalDocsGrabber#readme"
Documentation = "https://github.com/doc-bricks/UniversalDocsGrabber#readme"
Repository = "https://github.com/doc-bricks/UniversalDocsGrabber.git"
Issues = "https://github.com/doc-bricks/UniversalDocsGrabber/issues"
Changelog = "https://github.com/doc-bricks/UniversalDocsGrabber/blob/master/CHANGELOG.md"
Security = "https://github.com/doc-bricks/UniversalDocsGrabber/blob/master/SECURITY.md"
Contributing = "https://github.com/doc-bricks/UniversalDocsGrabber/blob/master/CONTRIBUTING.md"
Notice = "https://github.com/doc-bricks/UniversalDocsGrabber/blob/master/NOTICE"
"Plain-Text License" = "https://github.com/doc-bricks/UniversalDocsGrabber/blob/master/LICENSE"
"Third-Party Licenses" = "https://github.com/doc-bricks/UniversalDocsGrabber/blob/master/THIRD_PARTY_LICENSES.md"
"Third-Party Licenses (Text)" = "https://github.com/doc-bricks/UniversalDocsGrabber/blob/master/THIRD_PARTY_LICENSES.txt"
"Level 1 SBOM" = "https://github.com/doc-bricks/UniversalDocsGrabber/blob/master/THIRD_PARTY_LICENSES.md#8-level-1-sbom-invarianten-kreuzreferenzmatrix-inv-local-01-bis-inv-sla-10"
"Marketing Log" = "https://github.com/doc-bricks/UniversalDocsGrabber/blob/master/MARKETING-LOG.txt"
"LLM Ready" = "https://github.com/doc-bricks/UniversalDocsGrabber/blob/master/llms.txt"
"Parent Organization" = "https://github.com/doc-bricks"
"Umbrella Ecosystem" = "https://github.com/open-bricks"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -v --basetemp=.pytest_temp"
pythonpath = "."
testpaths = ["tests"]
python_files = ["test_*.py", "source_platform_smoke.py"]
norecursedirs = [".git", ".pytest_cache", ".pytest_temp", "__pycache__", "build", "dist", ".venv", "venv", ".ruff_cache"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C4"]
ignore = ["E501", "E701", "E702"]